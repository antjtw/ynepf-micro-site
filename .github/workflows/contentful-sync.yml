name: Sync Contentful content

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch: {}
  repository_dispatch:
    types: [contentful-publish]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch content from Contentful
        env:
          CONTENTFUL_SPACE_ID: ${{ secrets.CONTENTFUL_SPACE_ID }}
          CONTENTFUL_DELIVERY_TOKEN: ${{ secrets.CONTENTFUL_DELIVERY_TOKEN }}
        run: |
          node scripts/fetch-faqs.js
          node scripts/fetch-committee.js
          node scripts/fetch-competitions.js

      - name: Rebuild pages
        run: node build.js

      - name: Commit changes if any
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add faqs.html committee.html calendar.html assets/data
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Sync content from Contentful"
            git push
          fi
