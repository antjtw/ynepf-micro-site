name: Update lifting order

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch lifting order data
        run: node scripts/fetch-lifting-order.js

      - name: Commit changes if any
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/js/lifting-order-data.js
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update lifting order data"
            git push
          fi
