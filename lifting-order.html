<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lifting order &amp; volunteer rota — YNE Worlds 26</title>
  <meta name="description" content="Flight-by-flight lifting order and volunteer rota for YNE Worlds 26, 7–8 November 2026, Riccall Regen Centre.">
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="assets/css/fonts.css">
  <style>
    :root {
      --bg: #0B0C0D;
      --bg-raised: #16181A;
      --bg-band: #000000;
      --line: #2A2D30;
      --text: #F5F5F3;
      --text-muted: #A7ABAF;
      --accent: #E4FF3D;
      --font-body: "IBM Plex Sans", "Helvetica Neue", Arial, sans-serif;
      --font-display: "Cutmark", "IBM Plex Sans", "Helvetica Neue", Arial, sans-serif;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-body);
    }
    body {
      -webkit-font-smoothing: antialiased;
      line-height: 1.5;
    }
    .skip-link {
      position: absolute;
      left: -999px;
      top: 0;
      background: var(--accent);
      color: #000;
      padding: 0.5rem 1rem;
      font-weight: 600;
      z-index: 10;
    }
    .skip-link:focus {
      left: 0.5rem;
      top: 0.5rem;
    }
    a { color: var(--accent); }
    a:focus-visible, button:focus-visible {
      outline: 3px solid var(--accent);
      outline-offset: 2px;
    }

    .container {
      max-width: 52rem;
      margin: 0 auto;
      padding: 0 1rem;
    }

    /* Banner */
    .banner {
      background: var(--bg-band);
      border-top: 1px solid var(--line);
      padding-top: 32px;
    }
    .banner img {
      display: block;
      width: 100%;
      max-width: 52rem;
      height: auto;
      margin: 0 auto;
      border-radius: 10px;
    }

    main { padding: 2rem 0 4rem; }

    /* Tabs (top-level and sub-level share this look) */
    .tablist {
      display: flex;
      flex-wrap: wrap;
      gap: 0.25rem;
      border-bottom: 1px solid var(--line);
      margin-bottom: 1.5rem;
    }
    .tablist[data-level="sub"] { margin-bottom: 1.75rem; }
    .tab {
      appearance: none;
      background: none;
      border: none;
      border-bottom: 2px solid transparent;
      color: var(--text-muted);
      font: inherit;
      font-weight: 600;
      font-size: 0.95rem;
      padding: 0.75rem 1rem;
      cursor: pointer;
      margin-bottom: -1px;
    }
    .tablist[data-level="sub"] .tab { font-size: 0.85rem; padding: 0.6rem 0.85rem; }
    .tab:hover { color: var(--text); }
    .tab[aria-selected="true"] {
      color: var(--accent);
      border-bottom-color: var(--accent);
    }
    .tabpanel[hidden] { display: none; }

    .rota-head { margin-bottom: 1.5rem; }
    .rota-title {
      font-family: var(--font-display);
      font-variation-settings: "wght" 700, "wdth" 95;
      font-size: 1.35rem;
      letter-spacing: 0.02em;
      margin: 0 0 0.25rem;
    }
    .rota-day { color: var(--text-muted); margin: 0 0 0.5rem; }
    .rota-time { color: var(--text-muted); font-size: 0.9rem; }
    .rota-time strong { color: var(--text); font-weight: 600; }

    table.roster {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.95rem;
      background: var(--bg-raised);
      border: 1px solid var(--line);
      border-radius: 6px;
      overflow: hidden;
    }
    table.roster caption { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
    table.roster th, table.roster td {
      padding: 0.75rem 1.25rem;
      text-align: left;
      border-bottom: 1px solid var(--line);
      vertical-align: middle;
    }
    table.roster thead th {
      font-size: 0.75rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-muted);
      font-weight: 600;
    }
    table.roster tbody tr:last-child td { border-bottom: none; }
    table.roster td.role-cell { font-weight: 600; width: 40%; }
    .name-filled { color: var(--text); }
    .name-needed { color: var(--text-muted); font-style: italic; }

    h1 {
      font-family: var(--font-display);
      font-variation-settings: "wght" 700, "wdth" 90;
      font-size: clamp(1.5rem, 3vw, 2rem);
      margin: 0 0 0.25rem;
    }
    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
    }

    .status {
      color: var(--text-muted);
      font-size: 0.9rem;
      margin: 2rem 0 0;
    }
    .status[hidden] { display: none; }
    .error {
      background: #3A1414;
      border: 1px solid #6B2323;
      color: #FFD8D8;
      padding: 1rem 1.25rem;
      border-radius: 6px;
      margin-bottom: 2rem;
    }

    .day-block { margin-bottom: 3rem; }
    .day-heading {
      font-family: var(--font-display);
      font-variation-settings: "wght" 700, "wdth" 95;
      font-size: 1.35rem;
      letter-spacing: 0.02em;
      margin: 0 0 1rem;
      padding-bottom: 0.5rem;
      border-bottom: 2px solid var(--accent);
    }

    .session-block { margin-bottom: 2rem; }
    .session-head {
      background: #000;
      padding: 0.75rem 1.25rem;
      border-radius: 6px 6px 0 0;
      font-weight: 700;
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem 1rem;
      align-items: baseline;
    }
    .session-head .session-title { font-size: 1rem; }
    .session-times {
      text-align: center;
      background: var(--bg-raised);
      color: var(--text-muted);
      font-size: 0.85rem;
      padding: 0.6rem 1rem;
      border-left: 1px solid var(--line);
      border-right: 1px solid var(--line);
    }
    .session-times strong { color: var(--text); font-weight: 600; }

    .flight-block {
      background: var(--bg-raised);
      border: 1px solid var(--line);
      border-top: none;
    }
    .flight-block:last-child { border-radius: 0 0 6px 6px; }
    .flight-label {
      padding: 0.6rem 1.25rem 0;
      font-size: 0.75rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      font-weight: 700;
      color: var(--accent);
    }

    table.lifters {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.95rem;
    }
    table.lifters caption { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
    table.lifters th, table.lifters td {
      padding: 0.6rem 1.25rem;
      text-align: left;
      border-bottom: 1px solid var(--line);
      vertical-align: middle;
    }
    table.lifters thead th {
      font-size: 0.75rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-muted);
      font-weight: 600;
      border-bottom: 1px solid var(--line);
    }
    table.lifters tbody tr:last-child td { border-bottom: none; }
    table.lifters th.age-cell, table.lifters td.age-cell,
    table.lifters th.class-cell, table.lifters td.class-cell,
    table.lifters th.glp-cell, table.lifters td.glp-cell { width: 1%; white-space: nowrap; }
    table.lifters th.age-cell, table.lifters td.age-cell,
    table.lifters th.class-cell, table.lifters td.class-cell { text-align: center; }
    table.lifters th.glp-cell, table.lifters td.glp-cell { text-align: right; }
    table.lifters td.glp-cell { font-variant-numeric: tabular-nums; }
    .name-cell { display: flex; align-items: center; gap: 0.5rem; flex-wrap: nowrap; white-space: nowrap; }
    .name-link { color: var(--text); font-weight: 600; text-decoration: none; border-bottom: 1px solid transparent; }
    .name-link:hover, .name-link:focus-visible { color: var(--accent); border-bottom-color: currentColor; }
    .ig-link { display: inline-flex; color: var(--text-muted); }
    .ig-link:hover, .ig-link:focus-visible { color: var(--accent); }
    .ig-link svg { width: 16px; height: 16px; display: block; }

    /* Small screens: rows stay on one line, table scrolls horizontally instead of wrapping */
    .table-scroll {
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }
    @media (max-width: 640px) {
      .banner { padding: 1rem 1rem 0; }
      table.lifters { font-size: 0.85rem; }
      table.lifters th, table.lifters td { padding: 0.5rem 0.75rem; }
      .flight-label { padding-left: 0.75rem; padding-right: 0.75rem; }
    }

    @media (prefers-reduced-motion: reduce) {
      * { scroll-behavior: auto !important; }
    }
  </style>
</head>
<body>
  <a class="skip-link" href="#main">Skip to main content</a>

  <div class="banner">
    <img src="assets/img/banner.png" alt="YNE Worlds 26, 7–08 November 2026, Riccall Regen Centre, Riccall. British Powerlifting, Yorkshire &amp; the North East.">
  </div>

  <main id="main">
    <div class="container">
      <h1 class="visually-hidden">Lifting order and volunteer rota</h1>

      <div class="tablist" role="tablist" aria-label="Page section" data-level="top">
        <button class="tab" id="tab-lifting" role="tab" aria-selected="true" aria-controls="panel-lifting" type="button">Lifting order</button>
        <button class="tab" id="tab-volunteer" role="tab" aria-selected="false" aria-controls="panel-volunteer" tabindex="-1" type="button">Volunteer rota</button>
      </div>

      <div class="tabpanel" id="panel-lifting" role="tabpanel" aria-labelledby="tab-lifting">
        <div id="content"></div>
        <p class="status" id="status">Loading lifting order…</p>
      </div>

      <div class="tabpanel" id="panel-volunteer" role="tabpanel" aria-labelledby="tab-volunteer" hidden>
        <div class="tablist" role="tablist" aria-label="Volunteer rota" data-level="sub" id="rota-tablist"></div>
        <div id="rota-content"></div>
        <p class="status" id="rota-status">Loading volunteer rota…</p>
      </div>
    </div>
  </main>

  <script src="assets/js/lifting-order-data.js"></script>
  <script src="assets/js/volunteer-rota-data.js"></script>
  <script>
    (function () {
      var DAY_META = {
        1: "Saturday 7 November 2026",
        2: "Sunday 8 November 2026"
      };
      var SESSION_TIMES = {
        "1-1": { weighIn: "8:00am", liftOff: "10:00am" },
        "1-2": { weighIn: "Noon", liftOff: "2:00pm" },
        "2-1": { weighIn: "9:30am", liftOff: "11:30am" }
      };
      var SESSION_LABELS = {
        "2-1": "Prime time"
      };

      var IG_ICON =
        '<svg viewBox="0 0 24 24" fill="none" aria-hidden="true">' +
        '<rect x="2.5" y="2.5" width="19" height="19" rx="5" stroke="currentColor" stroke-width="1.8"/>' +
        '<circle cx="12" cy="12" r="4.3" stroke="currentColor" stroke-width="1.8"/>' +
        '<circle cx="17.4" cy="6.6" r="1.1" fill="currentColor"/>' +
        '</svg>';

      function esc(s) {
        return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
          return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
        });
      }

      function formatGlp(v) {
        if (v == null) return "";
        return Number(v).toFixed(2).replace(/\.00$/, "").replace(/(\.\d)0$/, "$1");
      }

      // "F57" -> 57, "M120+" -> 120.5 (so the + class sorts just above its base weight)
      function classWeight(cls) {
        var m = /(\d+(?:\.\d+)?)(\+)?\s*$/.exec(cls || "");
        if (!m) return Infinity;
        var n = parseFloat(m[1]);
        return m[2] ? n + 0.5 : n;
      }

      function render(lifters) {
        var statusEl = document.getElementById("status");
        var contentEl = document.getElementById("content");

        if (!lifters || !lifters.length) {
          statusEl.textContent = "No lifting order data is available right now.";
          return;
        }

        // Group: day -> session -> flight -> [lifters], preserving sheet order within a flight.
        var days = {};
        lifters.forEach(function (l) {
          if (l.day == null || l.session == null || !l.flight) return;
          days[l.day] = days[l.day] || {};
          days[l.day][l.session] = days[l.day][l.session] || {};
          days[l.day][l.session][l.flight] = days[l.day][l.session][l.flight] || [];
          days[l.day][l.session][l.flight].push(l);
        });

        var dayKeys = Object.keys(days).map(Number).sort(function (a, b) { return a - b; });
        var html = "";

        dayKeys.forEach(function (day) {
          var dayLabel = DAY_META[day] || ("Day " + day);
          html += '<section class="day-block" aria-labelledby="day-' + day + '-heading">';
          html += '<h2 class="day-heading" id="day-' + day + '-heading">Day ' + day + ' — ' + esc(dayLabel) + '</h2>';

          var sessionKeys = Object.keys(days[day]).map(Number).sort(function (a, b) { return a - b; });
          sessionKeys.forEach(function (session) {
            var times = SESSION_TIMES[day + "-" + session];
            html += '<div class="session-block">';
            var sessionLabel = SESSION_LABELS[day + "-" + session] || ("Session " + session);
            html += '<div class="session-head"><span class="session-title">' + esc(sessionLabel) + '</span></div>';
            if (times) {
              html += '<div class="session-times">Weigh-in <strong>' + esc(times.weighIn) + '</strong> &nbsp;·&nbsp; Lift off <strong>' + esc(times.liftOff) + '</strong></div>';
            }

            var flightKeys = Object.keys(days[day][session]).sort();
            flightKeys.forEach(function (flight) {
              var rows = days[day][session][flight];
              if (sessionLabel !== "Prime time") {
                rows = rows.slice().sort(function (a, b) {
                  var byClass = classWeight(a.class) - classWeight(b.class);
                  if (byClass !== 0) return byClass;
                  return (b.glp == null ? -Infinity : b.glp) - (a.glp == null ? -Infinity : a.glp);
                });
              }
              html += '<div class="flight-block">';
              html += '<p class="flight-label">Flight ' + esc(flight) + '</p>';
              html += '<div class="table-scroll"><table class="lifters"><caption>Flight ' + esc(flight) + ' lifting order</caption>';
              html += '<thead><tr><th scope="col">Name</th><th scope="col" class="age-cell">Age</th><th scope="col" class="class-cell">Class</th><th scope="col" class="glp-cell">GLP</th></tr></thead>';
              html += '<tbody>';
              rows.forEach(function (l) {
                var nameHtml = l.openIpf
                  ? '<a class="name-link" href="' + esc(l.openIpf) + '" target="_blank" rel="noopener">' + esc(l.name) + '</a>'
                  : '<span class="name-link">' + esc(l.name) + '</span>';
                var igHtml = l.instagram
                  ? '<a class="ig-link" href="https://www.instagram.com/' + esc(l.instagram) + '/" target="_blank" rel="noopener" aria-label="' + esc(l.name) + ' on Instagram">' + IG_ICON + '</a>'
                  : "";
                html += "<tr>";
                html += '<td data-label="Name"><span class="name-cell">' + nameHtml + igHtml + "</span></td>";
                html += '<td class="age-cell" data-label="Age">' + esc(l.age) + "</td>";
                html += '<td class="class-cell" data-label="Class">' + esc(l.class) + "</td>";
                html += '<td class="glp-cell" data-label="GLP">' + esc(formatGlp(l.glp)) + "</td>";
                html += "</tr>";
              });
              html += "</tbody></table></div></div>";
            });

            html += "</div>";
          });

          html += "</section>";
        });

        contentEl.innerHTML = html;

        var generated = window.LIFTING_ORDER_DATA && window.LIFTING_ORDER_DATA.generatedAt;
        statusEl.textContent = generated
          ? "Last updated " + new Date(generated).toLocaleString("en-GB", { dateStyle: "medium", timeStyle: "short" }) + "."
          : "";
      }

      if (window.LIFTING_ORDER_DATA && window.LIFTING_ORDER_DATA.lifters) {
        render(window.LIFTING_ORDER_DATA.lifters);
      } else {
        var statusEl = document.getElementById("status");
        var contentEl = document.getElementById("content");
        statusEl.setAttribute("hidden", "");
        contentEl.innerHTML = '<p class="error">Lifting order data failed to load. Try refreshing the page.</p>';
      }
    })();
  </script>

  <script>
    (function () {
      function esc(s) {
        return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
          return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
        });
      }

      // Wires a role="tablist" group to show/hide its aria-controls panels on
      // click or arrow-key navigation, per the WAI-ARIA Tabs pattern.
      function wireTabs(tablistEl) {
        var tabs = Array.prototype.slice.call(tablistEl.querySelectorAll('[role="tab"]'));

        function select(tab) {
          tabs.forEach(function (t) {
            var selected = t === tab;
            t.setAttribute("aria-selected", selected ? "true" : "false");
            t.tabIndex = selected ? 0 : -1;
            var panel = document.getElementById(t.getAttribute("aria-controls"));
            if (panel) panel.hidden = !selected;
          });
          tab.focus();
        }

        tabs.forEach(function (tab, i) {
          tab.addEventListener("click", function () {
            select(tab);
          });
          tab.addEventListener("keydown", function (e) {
            var next = null;
            if (e.key === "ArrowRight" || e.key === "ArrowDown") next = tabs[(i + 1) % tabs.length];
            else if (e.key === "ArrowLeft" || e.key === "ArrowUp") next = tabs[(i - 1 + tabs.length) % tabs.length];
            else if (e.key === "Home") next = tabs[0];
            else if (e.key === "End") next = tabs[tabs.length - 1];
            if (next) {
              e.preventDefault();
              select(next);
            }
          });
        });
      }

      // Top-level Lifting order / Volunteer rota tabs. Selecting a tab purely
      // toggles visibility; both panels render their content up front.
      wireTabs(document.querySelector('.tablist[data-level="top"]'));

      // --- Volunteer rota ---------------------------------------------------
      var NEEDED_TEXT = "Volunteer needed";

      function isNeeded(name) {
        return !name || name.trim() === "" || name.trim().toLowerCase() === NEEDED_TEXT.toLowerCase();
      }

      function renderVolunteerRota(data) {
        var statusEl = document.getElementById("rota-status");
        var tablistEl = document.getElementById("rota-tablist");
        var contentEl = document.getElementById("rota-content");

        if (!data || !data.rotas || !data.rotas.length) {
          statusEl.textContent = "No volunteer rota data is available right now.";
          return;
        }

        var tabsHtml = "";
        var panelsHtml = "";

        data.rotas.forEach(function (rota, i) {
          var parts = (rota.title || "").split(";");
          var tabLabel = (parts[0] || rota.title || "Rota " + (i + 1)).trim();
          var dayLabel = (parts[1] || "").trim();
          var tabId = "rota-tab-" + i;
          var panelId = "rota-panel-" + i;

          tabsHtml +=
            '<button class="tab" id="' + tabId + '" role="tab" aria-selected="' + (i === 0 ? "true" : "false") +
            '" aria-controls="' + panelId + '"' + (i === 0 ? "" : ' tabindex="-1"') + ' type="button">' +
            esc(tabLabel) + "</button>";

          panelsHtml += '<div class="tabpanel" id="' + panelId + '" role="tabpanel" aria-labelledby="' + tabId + '"' + (i === 0 ? "" : " hidden") + ">";
          panelsHtml += '<div class="rota-head">';
          panelsHtml += '<h2 class="rota-title">' + esc(tabLabel) + "</h2>";
          if (dayLabel) panelsHtml += '<p class="rota-day">' + esc(dayLabel) + "</p>";
          if (rota.time) panelsHtml += '<p class="rota-time">' + esc(rota.time) + "</p>";
          panelsHtml += "</div>";

          panelsHtml += '<table class="roster"><caption>' + esc(tabLabel) + ' volunteer roster</caption>';
          panelsHtml += '<thead><tr><th scope="col">Role</th><th scope="col">Volunteer</th></tr></thead><tbody>';
          (rota.roles || []).forEach(function (r) {
            var needed = isNeeded(r.name);
            panelsHtml += "<tr>";
            panelsHtml += '<td class="role-cell">' + esc(r.role) + "</td>";
            panelsHtml += needed
              ? '<td><span class="name-needed">' + esc(NEEDED_TEXT) + "</span></td>"
              : '<td><span class="name-filled">' + esc(r.name) + "</span></td>";
            panelsHtml += "</tr>";
          });
          panelsHtml += "</tbody></table>";
          panelsHtml += "</div>";
        });

        tablistEl.innerHTML = tabsHtml;
        contentEl.innerHTML = panelsHtml;
        wireTabs(tablistEl);

        statusEl.textContent = data.generatedAt
          ? "Last updated " + new Date(data.generatedAt).toLocaleString("en-GB", { dateStyle: "medium", timeStyle: "short" }) + "."
          : "";
      }

      if (window.VOLUNTEER_ROTA_DATA && window.VOLUNTEER_ROTA_DATA.rotas) {
        renderVolunteerRota(window.VOLUNTEER_ROTA_DATA);
      } else {
        var statusEl = document.getElementById("rota-status");
        statusEl.setAttribute("hidden", "");
        document.getElementById("rota-content").innerHTML = '<p class="error">Volunteer rota data failed to load. Try refreshing the page.</p>';
      }
    })();
  </script>
</body>
</html>
